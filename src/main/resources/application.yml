spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/tradedb
    username: ${DB_USER:trade_user}
    password: ${DB_PASS:trade_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: trade-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_COLLECTOR_HOST:localhost}:4318
  service:
    name: trade-service
  traces:
    exporter: otlp
  metrics:
    exporter: none